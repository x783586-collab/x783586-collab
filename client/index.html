<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14151a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>tg-hub · 多端消息</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <span class="brand">tg-<b>hub</b></span>
    <span class="conn"><span id="connDot" class="conn-dot"></span><span id="conn">未连接</span></span>
    <span class="spacer"></span>
    <span id="me"></span>
    <button class="icon-btn" id="btnSetup" title="设置">⚙</button>
  </div>

  <div class="sources" id="sources"></div>
  <div class="searchbar"><input id="search" placeholder="搜索会话或消息…"></div>

  <div class="main">
    <div id="list"></div>
    <div id="detail"></div>
  </div>

  <!-- 连接设置 -->
  <div class="overlay" id="setup" style="display:none">
    <div class="card">
      <h2>连接 Hub</h2>
      <p>这是多端消息挂件。所有设备连接同一个 Hub 即可看到同步的消息、已读和回复。</p>
      <div id="setupMsg"></div>
      <label>Hub 地址</label>
      <input id="cfgHub" placeholder="https://你的-hub-地址:8787">
      <label>连接口令</label>
      <input id="cfgToken" type="password" placeholder="config.json 里的 hubToken">
      <button class="btn" id="cfgSave">连接并保存</button>
      <button class="link" id="cfgReset">清除配置重新设置</button>
    </div>
  </div>

  <div id="toast"></div>
  <script src="app.js"></script>
  <script>
    // 设置按钮 & 手机详情页返回
    document.getElementById('btnSetup').onclick = function () {
      document.getElementById('setup').style.display = 'flex';
    };
    // 手机端点会话进入详情，点详情头部返回
    var listEl = document.getElementById('list');
    listEl.addEventListener('click', function (e) {
      if (window.innerWidth <= 640) document.body.classList.add('show-detail');
    });
    document.getElementById('detail').addEventListener('click', function (e) {
      if (e.target.closest('.detail-head') && window.innerWidth <= 640) {
        document.body.classList.remove('show-detail');
      }
    }, true);
  </script>
</body>
</html>
